<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team — Join Request</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/dcm-auth.css">
    <link rel="icon" type="image/png" href="assets/logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

</head>


<body class="join-page">

    <main class="join-card">

        <!-- BRAND -->
        <div class="join-brand">

            <img
                src="assets/logo.png"
                class="join-logo"
                alt="Design and Craft Mart logo"
            >

            <h1>TEAM</h1>

            <p>Design and Craft Mart</p>

        </div>


        <!-- INTRO -->
        <p class="join-intro">
            To join the team, please fill up the form.<br>
            Admin will review and approve your request before you can log in.
        </p>


        <!-- MESSAGE -->
        <div
            class="join-message"
            id="msgBox"
            role="alert"
        ></div>


        <!-- FORM -->
        <form
            id="joinForm"
            class="join-form"
            novalidate
        >

            <!-- FULL NAME -->
            <div class="join-field">

                <label for="fullName">
                    Full Name *
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- MOBILE -->
            <div class="join-field">

                <label for="mobile">
                    Mobile Number *
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- ADDRESS -->
            <div class="join-field full">

                <label for="address">
                    Address *
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    autocomplete="street-address"
                    required
                >

            </div>


            <!-- FACEBOOK -->
            <div class="join-field full">

                <label for="fbProfile">
                    Facebook Profile Link / ID Name
                </label>

                <input
                    type="text"
                    id="fbProfile"
                    name="fbProfile"
                    placeholder="facebook.com/yourname"
                    autocomplete="url"
                >

            </div>


            <!-- DIVIDER -->
            <hr class="join-divider">


            <!-- LOGIN INFORMATION -->
            <div class="join-section-title">
                Login Information
            </div>


            <!-- EMAIL -->
            <div class="join-field">

                <label for="email">
                    Email *
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="join-field">

                <label for="password">
                    Password *
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                class="join-submit"
                id="submitBtn"
            >
                Send Request
            </button>

        </form>


        <!-- LOGIN -->
        <div class="join-login">

            Have an approved account?

            <a href="index.html">
                Log in
            </a>

        </div>

    </main>


    <script>
        document.addEventListener("DOMContentLoaded", () => {

            document.body.classList.add("page-ready");


            const form =
                document.getElementById("joinForm");

            const submitBtn =
                document.getElementById("submitBtn");

            const msgBox =
                document.getElementById("msgBox");


            if (!form) {
                console.error("joinForm not found");
                return;
            }


            function showMessage(
                message,
                type = "error"
            ) {

                if (!msgBox) {
                    alert(message);
                    return;
                }


                msgBox.style.display = "block";

                msgBox.textContent = message;


                if (type === "success") {

                    msgBox.style.background =
                        "rgba(80,180,120,.10)";

                    msgBox.style.border =
                        "1px solid rgba(80,180,120,.30)";

                    msgBox.style.color =
                        "#8de0aa";

                } else {

                    msgBox.style.background =
                        "rgba(226,96,79,.10)";

                    msgBox.style.border =
                        "1px solid rgba(226,96,79,.30)";

                    msgBox.style.color =
                        "#ff9b8d";
                }
            }


            form.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();


                    const fullName =
                        document
                            .getElementById("fullName")
                            ?.value
                            .trim();


                    const mobile =
                        document
                            .getElementById("mobile")
                            ?.value
                            .trim();


                    const address =
                        document
                            .getElementById("address")
                            ?.value
                            .trim();


                    const fbProfile =
                        document
                            .getElementById("fbProfile")
                            ?.value
                            .trim();


                    const email =
                        document
                            .getElementById("email")
                            ?.value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            ?.value;


                    /* VALIDATION */

                    if (
                        !fullName ||
                        !mobile ||
                        !address ||
                        !email ||
                        !password
                    ) {

                        showMessage(
                            "Please fill in all required fields."
                        );

                        return;
                    }


                    if (password.length < 6) {

                        showMessage(
                            "Password must be at least 6 characters."
                        );

                        return;
                    }


                    if (
                        typeof supabaseClient ===
                        "undefined" ||
                        !supabaseClient
                    ) {

                        console.error(
                            "supabaseClient is not available"
                        );

                        showMessage(
                            "Database connection is not available."
                        );

                        return;
                    }


                    submitBtn.disabled = true;

                    submitBtn.textContent =
                        "Sending...";


                    try {

                        /*
                         * CREATE SUPABASE AUTH ACCOUNT
                         */

                        const {
                            data: authData,
                            error: authError
                        } =
                            await supabaseClient.auth.signUp({

                                email: email,

                                password: password,

                                options: {

                                    data: {

                                        full_name:
                                            fullName,

                                        mobile:
                                            mobile,

                                        address:
                                            address,

                                        fb_profile:
                                            fbProfile || ""

                                    }

                                }

                            });


                        if (authError) {

                            console.error(
                                "Auth signup error:",
                                authError
                            );

                            throw authError;
                        }


                        const user =
                            authData?.user;


                        if (!user) {

                            throw new Error(
                                "Account could not be created."
                            );
                        }


                        /*
                         * SUCCESS
                         */

                        showMessage(
                            "Your join request has been sent successfully. Please wait for admin approval.",
                            "success"
                        );


                        form.reset();


                        submitBtn.textContent =
                            "Request Sent";

                    } catch (error) {

                        console.error(
                            "Join request failed:",
                            error
                        );


                        showMessage(
                            error?.message ||
                            "Could not send join request."
                        );


                        submitBtn.disabled = false;

                        submitBtn.textContent =
                            "Send Request";
                    }

                }
            );

        });
    </script>

</body>
</html>
