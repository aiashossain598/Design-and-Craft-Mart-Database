<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team — Join Request</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <style>
        /* =========================================================
           JOIN REQUEST PAGE
        ========================================================= */

        .join-page {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
            box-sizing: border-box;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(211, 166, 83, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(211, 166, 83, 0.08),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #070707,
                    #11110f,
                    #080808
                );

            color: #f1eee7;
        }


        /* =========================================================
           CARD
        ========================================================= */

        .join-card {
            width: min(720px, 100%);

            padding: 38px;

            box-sizing: border-box;

            background:
                linear-gradient(
                    145deg,
                    rgba(23, 23, 23, 0.98),
                    rgba(9, 9, 9, 0.98)
                );

            border: 1px solid rgba(211, 166, 83, 0.30);

            border-radius: 18px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px rgba(255, 255, 255, 0.03);

            animation: joinCardIn 0.55s ease-out both;
        }


        /* FIXED ANIMATION BLOCK */
        @keyframes joinCardIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .join-brand {
            text-align: center;
            margin-bottom: 18px;
        }


        .join-logo {
            height: 75px;
            width: auto;

            max-width: 180px;

            object-fit: contain;

            display: block;

            margin: 0 auto 12px;
        }


        .join-brand h1 {
            margin: 0;

            color: var(--gold-light, #e4bf78);

            font-family: Georgia, "Times New Roman", serif;

            font-size: 27px;

            letter-spacing: 3px;
        }


        .join-brand p {
            margin: 8px 0 0;

            color: #777;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* =========================================================
           INTRO
        ========================================================= */

        .join-intro {
            text-align: center;

            color: #929292;

            font-size: 14px;

            line-height: 1.7;

            margin: 0 auto 28px;

            max-width: 600px;
        }


        /* =========================================================
           MESSAGE
        ========================================================= */

        .join-message {
            display: none;

            width: 100%;

            box-sizing: border-box;

            padding: 12px 14px;

            margin-bottom: 20px;

            border-radius: 9px;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .join-form {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 24px;

            margin: 0 auto;

            box-sizing: border-box;
        }


        .join-field {
            width: 100%;

            min-width: 0;
        }


        .join-field.full {
            grid-column: 1 / -1;
        }


        .join-field label {
            display: block;

            margin-bottom: 8px;

            color: #d0d0d0;

            font-size: 13px;

            font-weight: 500;
        }


        /* =========================================================
           INPUTS
        ========================================================= */

        .join-field input,
        .join-field textarea,
        .join-field select {
            width: 100%;

            max-width: 100%;

            min-width: 0;

            box-sizing: border-box;

            border: 1px solid #353535;

            border-radius: 9px;

            background: #0c0c0c;

            color: #f1eee7;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }


        .join-field input,
        .join-field select {
            height: 48px;

            padding: 0 14px;
        }


        .join-field textarea {
            min-height: 110px;

            padding: 13px 14px;

            resize: vertical;
        }


        .join-field input::placeholder,
        .join-field textarea::placeholder {
            color: #555;
        }


        .join-field input:focus,
        .join-field textarea:focus,
        .join-field select:focus {
            border-color: rgba(211, 166, 83, 0.85);

            box-shadow:
                0 0 0 3px rgba(211, 166, 83, 0.09);

            background: #0f0f0f;

            transform: translateY(-1px);
        }


        /* =========================================================
           DIVIDER
        ========================================================= */

        .join-divider {
            grid-column: 1 / -1;

            width: 100%;

            border: 0;

            border-top:
                1px solid rgba(211, 166, 83, 0.18);

            margin: 4px 0;
        }


        /* =========================================================
           SECTION TITLE
        ========================================================= */

        .join-section-title {
            grid-column: 1 / -1;

            color: var(--gold-light, #e4bf78);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;

            letter-spacing: 1.5px;

            margin-top: 2px;
        }


        /* =========================================================
           SUBMIT BUTTON
        ========================================================= */

        .join-submit {
            grid-column: 1 / -1;

            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #e4bf78,
                    #b98835
                );

            color: #17120a;

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .join-submit:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px
                rgba(211, 166, 83, 0.18);
        }


        .join-submit:active {
            transform: translateY(0);
        }


        .join-submit:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =========================================================
           LOGIN LINK
        ========================================================= */

        .join-login {
            margin-top: 22px;

            padding-top: 20px;

            border-top:
                1px solid rgba(211, 166, 83, 0.12);

            text-align: center;

            color: #777;

            font-size: 13px;
        }


        .join-login a {
            color: var(--gold-light, #e4bf78);

            text-decoration: none;

            font-weight: 600;

            transition: color 0.2s ease;
        }


        .join-login a:hover {
            color: #f0d08c;

            text-decoration: underline;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 640px) {

            .join-page {
                min-height: 100svh;

                padding: 20px 12px;

                align-items: flex-start;
            }


            .join-card {
                width: 100%;

                padding: 25px 18px;

                border-radius: 14px;
            }


            .join-form {
                grid-template-columns: 1fr;

                gap: 17px;
            }


            .join-field.full,
            .join-divider,
            .join-section-title,
            .join-submit {
                grid-column: 1;
            }


            .join-logo {
                height: 65px;
            }


            .join-brand h1 {
                font-size: 21px;

                letter-spacing: 2.5px;
            }


            .join-brand p {
                font-size: 9px;

                letter-spacing: 2.5px;
            }


            .join-intro {
                font-size: 13px;

                margin-bottom: 24px;
            }


            .join-field input,
            .join-field select {
                height: 47px;
            }
        }


        /* =========================================================
           SMALL MOBILE
        ========================================================= */

        @media (max-width: 400px) {

            .join-card {
                padding: 22px 15px;
            }


            .join-brand h1 {
                font-size: 19px;
            }


            .join-intro {
                font-size: 12px;
            }
        }
    </style>
</head>


<body class="join-page">

    <main class="join-card">

        <!-- BRAND -->
        <div class="join-brand">

            <img
                src="assets/logo.png"
                class="join-logo"
                alt="Design and Craft Mart logo"
            >

            <h1>TEAM</h1>

            <p>Design and Craft Mart</p>

        </div>


        <!-- INTRO -->
        <p class="join-intro">
            To join the team, please fill up the form.<br>
            Admin will review and approve your request before you can log in.
        </p>


        <!-- MESSAGE -->
        <div
            class="join-message"
            id="msgBox"
            role="alert"
        ></div>


        <!-- FORM -->
        <form
            id="joinForm"
            class="join-form"
            novalidate
        >

            <!-- FULL NAME -->
            <div class="join-field">

                <label for="fullName">
                    Full Name *
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- MOBILE -->
            <div class="join-field">

                <label for="mobile">
                    Mobile Number *
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- ADDRESS -->
            <div class="join-field full">

                <label for="address">
                    Address *
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    autocomplete="street-address"
                    required
                >

            </div>


            <!-- FACEBOOK -->
            <div class="join-field full">

                <label for="fbProfile">
                    Facebook Profile Link / ID Name
                </label>

                <input
                    type="text"
                    id="fbProfile"
                    name="fbProfile"
                    placeholder="facebook.com/yourname"
                    autocomplete="url"
                >

            </div>


            <!-- DIVIDER -->
            <hr class="join-divider">


            <!-- LOGIN INFORMATION -->
            <div class="join-section-title">
                Login Information
            </div>


            <!-- EMAIL -->
            <div class="join-field">

                <label for="email">
                    Email *
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="join-field">

                <label for="password">
                    Password *
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                class="join-submit"
                id="submitBtn"
            >
                Send Request
            </button>

        </form>


        <!-- LOGIN -->
        <div class="join-login">

            Have an approved account?

            <a href="index.html">
                Log in
            </a>

        </div>

    </main>


    <script>
        document.addEventListener("DOMContentLoaded", () => {

            document.body.classList.add("page-ready");


            const form =
                document.getElementById("joinForm");

            const submitBtn =
                document.getElementById("submitBtn");

            const msgBox =
                document.getElementById("msgBox");


            if (!form) {
                console.error("joinForm not found");
                return;
            }


            function showMessage(
                message,
                type = "error"
            ) {

                if (!msgBox) {
                    alert(message);
                    return;
                }


                msgBox.style.display = "block";

                msgBox.textContent = message;


                if (type === "success") {

                    msgBox.style.background =
                        "rgba(80,180,120,.10)";

                    msgBox.style.border =
                        "1px solid rgba(80,180,120,.30)";

                    msgBox.style.color =
                        "#8de0aa";

                } else {

                    msgBox.style.background =
                        "rgba(226,96,79,.10)";

                    msgBox.style.border =
                        "1px solid rgba(226,96,79,.30)";

                    msgBox.style.color =
                        "#ff9b8d";
                }
            }


            form.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();


                    const fullName =
                        document
                            .getElementById("fullName")
                            ?.value
                            .trim();


                    const mobile =
                        document
                            .getElementById("mobile")
                            ?.value
                            .trim();


                    const address =
                        document
                            .getElementById("address")
                            ?.value
                            .trim();


                    const fbProfile =
                        document
                            .getElementById("fbProfile")
                            ?.value
                            .trim();


                    const email =
                        document
                            .getElementById("email")
                            ?.value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            ?.value;


                    /* VALIDATION */

                    if (
                        !fullName ||
                        !mobile ||
                        !address ||
                        !email ||
                        !password
                    ) {

                        showMessage(
                            "Please fill in all required fields."
                        );

                        return;
                    }


                    if (password.length < 6) {

                        showMessage(
                            "Password must be at least 6 characters."
                        );

                        return;
                    }


                    if (
                        typeof supabaseClient ===
                        "undefined" ||
                        !supabaseClient
                    ) {

                        console.error(
                            "supabaseClient is not available"
                        );

                        showMessage(
                            "Database connection is not available."
                        );

                        return;
                    }


                    submitBtn.disabled = true;

                    submitBtn.textContent =
                        "Sending...";


                    try {

                        /*
                         * CREATE SUPABASE AUTH ACCOUNT
                         */

                        const {
                            data: authData,
                            error: authError
                        } =
                            await supabaseClient.auth.signUp({

                                email: email,

                                password: password,

                                options: {

                                    data: {

                                        full_name:
                                            fullName,

                                        mobile:
                                            mobile,

                                        address:
                                            address,

                                        fb_profile:
                                            fbProfile || ""

                                    }

                                }

                            });


                        if (authError) {

                            console.error(
                                "Auth signup error:",
                                authError
                            );

                            throw authError;
                        }


                        const user =
                            authData?.user;


                        if (!user) {

                            throw new Error(
                                "Account could not be created."
                            );
                        }


                        /*
                         * SUCCESS
                         */

                        showMessage(
                            "Your join request has been sent successfully. Please wait for admin approval.",
                            "success"
                        );


                        form.reset();


                        submitBtn.textContent =
                            "Request Sent";

                    } catch (error) {

                        console.error(
                            "Join request failed:",
                            error
                        );


                        showMessage(
                            error?.message ||
                            "Could not send join request."
                        );


                        submitBtn.disabled = false;

                        submitBtn.textContent =
                            "Send Request";
                    }

                }
            );

        });
    </script>

</body>
</html>
